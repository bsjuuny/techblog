<link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Blog",
  "name": "{{ site.title }}",
  "url": "{{ site.url }}{{ site.baseurl }}/",
  "description": "{{ site.description }}",
  "inLanguage": "ko-KR",
  "author": {
    "@type": "Person",
    "name": "백승준",
    "sameAs": ["https://github.com/bsjuuny"]
  }
}
</script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  document.querySelectorAll('.page__content a[href]').forEach(function (link) {
    var href = link.getAttribute('href') || '';
    var url;
    try {
      url = new URL(href, window.location.href);
    } catch (error) {
      return;
    }
    if (href.charAt(0) === '#' || url.origin === window.location.origin) return;
    link.setAttribute('target', '_blank');
    var rel = (link.getAttribute('rel') || '').split(/\s+/).filter(Boolean);
    if (rel.indexOf('noopener') === -1) rel.push('noopener');
    if (rel.indexOf('noreferrer') === -1) rel.push('noreferrer');
    link.setAttribute('rel', rel.join(' '));
  });
});
</script>
