<link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">
<meta name="theme-color" content="#17365d">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Blog",
  "name": "{{ site.title }}",
  "url": "{{ site.url }}{{ site.baseurl }}/",
  "description": "{{ site.description }}",
  "inLanguage": "ko-KR",
  "author": {
    "@type": "Person",
    "name": "백승준",
    "sameAs": ["https://github.com/bsjuuny"]
  }
}
</script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  document.querySelectorAll('.page__content a[href]').forEach(function (link) {
    var href = link.getAttribute('href') || '';
    if (href.charAt(0) === '#') return; // in-page anchors (TOC, heading permalinks) stay in this tab
    link.setAttribute('target', '_blank');
    var rel = (link.getAttribute('rel') || '').split(/\s+/).filter(Boolean);
    if (rel.indexOf('noopener') === -1) rel.push('noopener');
    if (rel.indexOf('noreferrer') === -1) rel.push('noreferrer');
    link.setAttribute('rel', rel.join(' '));
  });
});
</script>
