remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "default"

locale: "ko-KR"
title: "Frontend Engineering Notes"
title_separator: "|"
name: "백승준"
description: "React, TypeScript, Web Standards, Enterprise UI 개발 과정에서 얻은 문제 해결 경험을 기록하는 기술 블로그"
url: "https://bsjuuny.github.io"
baseurl: "/techblog"
repository: "bsjuuny/techblog"
# 글마다 대표 이미지가 없으므로, 공유·AI 카드에 쓰일 기본 OG 이미지를 사이트 전역으로 둔다
# (생성: scripts/make_og_image.py). 테마 _includes/seo.html 이 og:image / twitter:image 로 쓴다.
og_image: "/assets/images/og-default.png"
masthead_title: "Frontend Engineering Notes"
breadcrumbs: false
words_per_minute: 200
search: true
search_full_content: true
search_provider: "lunr"

social:
  type: "Person"
  name: "백승준"
  links:
    - "https://github.com/bsjuuny"

author:
  name: "백승준"
  avatar: "/assets/images/david.png"
  bio: "Senior Frontend Engineer & Full-Stack Web Developer"
  location: "Seoul, Republic of Korea"
  # 아래 세 값은 /about/ 의 Person JSON-LD 와 llms.txt 가 함께 쓴다.
  # 한 사람을 가리키는 표기(한글·로마자·영문 이름)를 묶어 검색·AI 에이전트가 같은 인물로 보게 한다.
  # About 화면에 보이는 내용과 어긋나는 값은 넣지 않는다.
  alternate_names:
    - "Baek Seungjun"
    - "David Baek"
  job_title: "Senior Frontend Engineer & Full-Stack Web Developer"
  # 구조화 데이터에는 도시 대신 나라만 싣는다(개인 거주지 공개 범위 최소화).
  country: "South Korea"
  knows_about:
    - "React"
    - "TypeScript"
    - "JavaScript"
    - "Vue.js"
    - "Angular"
    - "Java"
    - "Spring Boot"
    - "HTML5"
    - "CSS3"
    - "jQuery"
    - "Adobe Experience Manager (AEM)"
    - "PostgreSQL"
    - "REST API"
    - "GraphQL"
    - "Web Standards"
    - "Web Accessibility"
    - "Responsive Web Design"
    - "Enterprise UI"
    - "Enterprise Web Applications"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/bsjuuny"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/bsjuuny"

atom_feed:
  path: "https://bsjuuny.github.io/techblog/feed.xml"

analytics:
  provider: false

comments:
  provider: false

include:
  - _pages

exclude:
  - AGENTS.md
  - vendor
  - .bundle
  - .jekyll-cache
  - .sass-cache
  - node_modules
  - Gemfile.lock
  - CLAUDE.md
  - docs
  - scripts

encoding: "utf-8"
timezone: "Asia/Seoul"
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  toc_levels: 1..3

sass:
  sass_dir: _sass
  style: compressed

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-include-cache

whitelist:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-include-cache

category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/

compress_html:
  clippings: all
  ignore:
    envs: development

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      classes: wide
      author_profile: false
      read_time: true
      comments: false
      share: false
      related: false
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      classes: wide
      author_profile: false
