remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "default"

locale: "ko-KR"
title: "Frontend Engineering Notes"
title_separator: "|"
name: "백승준"
description: "React, TypeScript, Web Standards, Enterprise UI 개발 과정에서 얻은 문제 해결 경험을 기록하는 기술 블로그"
url: "https://bsjuuny.github.io"
baseurl: "/techblog"
repository: "bsjuuny/techblog"
masthead_title: "Frontend Engineering Notes"
breadcrumbs: false
words_per_minute: 200
search: true
search_full_content: true
search_provider: "lunr"

social:
  type: "Person"
  name: "백승준"
  links:
    - "https://github.com/bsjuuny"

author:
  name: "백승준"
  avatar: "/assets/images/david.png"
  bio: "Frontend Engineer writing about UI engineering and production experience"
  location: "Seoul, Republic of Korea"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/bsjuuny"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/bsjuuny"

atom_feed:
  path: "/feed.xml"

analytics:
  provider: false

comments:
  provider: false

include:
  - _pages

exclude:
  - vendor
  - .bundle
  - .jekyll-cache
  - .sass-cache
  - node_modules
  - Gemfile.lock
  - PORTFOLIO_REVIEW.md
  - CAREER_DATA_REVIEW.md
  - SECURITY_CONTENT_REVIEW.md
  - CONTENT_PLAN.md

encoding: "utf-8"
timezone: "Asia/Seoul"
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  toc_levels: 1..3

sass:
  sass_dir: _sass
  style: compressed

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-include-cache

whitelist:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-include-cache

category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/

compress_html:
  clippings: all
  ignore:
    envs: development

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      classes: wide
      author_profile: false
      read_time: true
      comments: false
      share: false
      related: false
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      classes: wide
      author_profile: false
